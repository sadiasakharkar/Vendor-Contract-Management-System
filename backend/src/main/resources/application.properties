spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vendor_contract_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-32-byte-minimum-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
springdoc.swagger-ui.path=/swagger-ui.html
